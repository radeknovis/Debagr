name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        run: ./scripts/setup-ci-tools.sh
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Tests
      - name: Check strict concurrency against migration baseline
        run: |
          mkdir -p .build
          python3 -m unittest discover -s scripts/tests -v
          swift build --scratch-path .build/concurrency -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency 2>&1 | tee .build/concurrency-diagnostics.log | xcsift -f toon -w -e -E
          python3 scripts/check-concurrency.py .build/concurrency-diagnostics.log
      - name: Test
        run: swift test 2>&1 | xcsift -f toon -w -e -E
      - name: Package
        run: ./scripts/build-macos-app.sh release
      - name: Verify bundle
        run: ./scripts/verify-macos-app.sh
      - name: Smoke-check packaged JSON CLI
        run: python3 scripts/check-agent-cli.py
      - name: Check menu-bar shutdown
        run: python3 scripts/check-menu-bar-shutdown.py
      - name: Check release safety
        run: python3 scripts/check-release.py
      - name: Check documentation links
        run: python3 scripts/check-docs.py
      - name: Package and verify agent plugins
        run: python3 scripts/package-plugins.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Debagr-agent-plugins
          path: |
            dist/debagr-*.zip
            dist/debagr-*.zip.sha256
      - name: Archive app preserving permissions
        run: ditto -c -k --keepParent Debagr.app Debagr-unsigned.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Debagr-unsigned
          path: Debagr-unsigned.zip
