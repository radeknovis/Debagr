name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install xcsift
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Tests
      - name: Test
        run: swift test 2>&1 | xcsift -f toon -w -e -E
      - name: Package
        run: ./scripts/build-macos-app.sh release
      - name: Verify bundle
        run: ./scripts/verify-macos-app.sh
      - name: Smoke-check packaged JSON CLI
        run: python3 scripts/check-agent-cli.py
      - name: Check release safety
        run: python3 scripts/check-release.py
      - name: Package and verify agent plugins
        run: python3 scripts/package-plugins.py
      - uses: actions/upload-artifact@v6
        with:
          name: Debagr-agent-plugins
          path: |
            dist/debagr-*.zip
            dist/debagr-*.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: Debagr-unsigned
          path: Debagr.app
