name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install swift-format xcsift
      - name: Lint
        run: swift-format lint --recursive Sources Tests
      - name: Test
        run: swift test 2>&1 | xcsift -f toon -w -e -E
      - name: Package
        run: ./scripts/build-macos-app.sh release
      - name: Verify bundle
        run: ./scripts/verify-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Debagr-unsigned
          path: Debagr.app
