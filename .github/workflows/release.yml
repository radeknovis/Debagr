name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version matching the selected v tag, for example 0.2.0
        required: true
      build_number:
        description: Monotonically increasing build number
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate tag and credentials
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid build number"; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/v$VERSION" ]] || { echo "::error::Tag must match version"; exit 1; }
          for field in CERTIFICATE_P12 CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!field}" ]]; then echo "::error::Missing release secret: $field"; exit 1; fi
          done
      - name: Install build tools
        run: ./scripts/setup-ci-tools.sh
      - name: Check release safety
        run: python3 scripts/check-release.py
      - name: Package and verify agent plugins
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/package-plugins.py
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          echo "$CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/debagr.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/debagr.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/debagr.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/debagr.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$RUNNER_TEMP/debagr.keychain-db" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$RUNNER_TEMP/debagr.keychain-db" > /dev/null
      - name: Configure notarization
        env:
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          umask 077
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials debagr-ci --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$RUNNER_TEMP/debagr.keychain-db"
      - name: Build, sign, notarize, and staple
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_PROFILE: debagr-ci
          NOTARY_KEYCHAIN: ${{ runner.temp }}/debagr.keychain-db
          DEBAGR_WEBSITE_URL: ${{ vars.DEBAGR_WEBSITE_URL }}
          DEBAGR_SUPPORT_URL: ${{ vars.DEBAGR_SUPPORT_URL }}
        run: ./scripts/release-macos-app.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Debagr-${{ inputs.version }}
          path: dist/
          if-no-files-found: ignore
      - name: Prepare draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --verify-tag --draft --prerelease \
            --title "Debagr $VERSION — Technical Preview" --notes-file Marketing/release-notes.md \
            "dist/Debagr-$VERSION.dmg" "dist/Debagr-$VERSION.dmg.sha256" \
            dist/debagr-*-"$VERSION".zip dist/debagr-*-"$VERSION".zip.sha256
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/debagr.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
