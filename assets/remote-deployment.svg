<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">From your Builder Mac to your roaming iPhone or iPad</title>
  <desc id="desc">A paired Builder Mac keeps Apple trust, Xcode, and signing at home or office. Over a private VPN, Debagr bridges installs and launches to your physical iPhone or iPad on another Wi-Fi network.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --panel: #f8fafc;
      --panel-stroke: #cbd5e1;
      --wire: #94a3b8;
      --blue: #2563eb;
      --teal: #0d9488;
      --green: #059669;
      --badge-bg: #eef2ff;
      --badge-stroke: #c7d2fe;
      --screen-fill: #e0f2fe;
      --ok-fill: #dcfce7;
      --chip-bg: #f1f5f9;
      --chip-stroke: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --ink: #f1f5f9;
        --muted: #94a3b8;
        --panel: #151b23;
        --panel-stroke: #30363d;
        --wire: #484f58;
        --blue: #60a5fa;
        --teal: #2dd4bf;
        --green: #34d399;
        --badge-bg: #172554;
        --badge-stroke: #1e40af;
        --screen-fill: #132238;
        --ok-fill: #064e3b;
        --chip-bg: #1f2937;
        --chip-stroke: #374151;
      }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .muted { fill: var(--muted); }
    .wire { fill: none; stroke: var(--wire); stroke-width: 2.2; }
    .packet-out {
      animation: flow-right 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .packet-out-2 {
      animation-delay: -2.3s;
    }
    .packet-ack {
      animation: flow-left 4.6s ease-in-out infinite;
      animation-delay: -1.1s;
    }
    .pulse-ring {
      animation: pulse 2.4s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes flow-right {
      0% { transform: translateX(0); opacity: 0; }
      10%, 88% { opacity: 1; }
      100% { transform: translateX(316px); opacity: 0; }
    }
    @keyframes flow-left {
      0% { transform: translateX(0); opacity: 0; }
      12%, 86% { opacity: 0.95; }
      100% { transform: translateX(-316px); opacity: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.75; }
      70%, 100% { transform: scale(1.22); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .packet-out, .packet-out-2, .packet-ack, .pulse-ring {
        animation: none;
      }
      .packet-out { transform: translateX(158px); opacity: 1; }
      .packet-out-2 { display: none; }
      .packet-ack { transform: translateX(-158px); opacity: 0.9; }
      .pulse-ring { opacity: 0; }
    }
  </style>

  <!-- Subtle outer zone cards -->
  <rect x="24" y="24" width="294" height="314" rx="22" fill="var(--panel)" stroke="var(--panel-stroke)" stroke-width="1.2"/>
  <rect x="682" y="24" width="294" height="314" rx="22" fill="var(--panel)" stroke="var(--panel-stroke)" stroke-width="1.2"/>

  <!-- Zone headers -->
  <text x="171" y="56" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.8" class="muted">HOME / OFFICE WI-FI</text>
  <text x="829" y="56" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.8" class="muted">CAFE / TRAVEL WI-FI</text>

  <!-- Builder Mac display illustration -->
  <rect x="76" y="78" width="190" height="122" rx="12" fill="var(--screen-fill)" stroke="var(--ink)" stroke-width="2.6"/>
  <path d="M148 200 v17 h-28 m74 -17 v17 h28" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="171" y="128" text-anchor="middle" font-size="21" font-weight="700">Xcode</text>
  <text x="171" y="153" text-anchor="middle" font-size="14.5" font-weight="600" style="fill:var(--blue);">+ Debagr</text>
  <rect x="96" y="168" width="150" height="20" rx="10" fill="var(--chip-bg)" stroke="var(--chip-stroke)" stroke-width="1"/>
  <text x="171" y="182" text-anchor="middle" font-size="10.5" font-weight="600" class="muted">CLI · MCP · SSH Host</text>

  <text x="171" y="256" text-anchor="middle" font-size="20" font-weight="700">Builder Mac</text>
  <text x="171" y="280" text-anchor="middle" font-size="13.5" class="muted">Keeps pairing, trust &amp; signing</text>
  <rect x="95" y="294" width="152" height="24" rx="12" fill="var(--badge-bg)" stroke="var(--badge-stroke)" stroke-width="1"/>
  <text x="171" y="310" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--blue);">Claude Code / Codex</text>

  <!-- Center Private VPN Bridge -->
  <rect x="392" y="54" width="216" height="52" rx="14" fill="var(--badge-bg)" stroke="var(--badge-stroke)" stroke-width="1.2"/>
  <text x="500" y="77" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--blue);">Private VPN Bridge</text>
  <text x="500" y="95" text-anchor="middle" font-size="11" font-weight="600" class="muted">Zero cloud · Zero open ports</text>

  <!-- Top outbound deploy track -->
  <path d="M330 154 H670" class="wire" stroke-dasharray="6 7"/>
  <path d="M661 149 L671 154 L661 159" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="138" text-anchor="middle" font-size="12.5" font-weight="600" class="muted">Install, verify &amp; launch (.app)</text>

  <g>
    <rect class="packet-out" x="338" y="147" width="18" height="14" rx="4" fill="var(--blue)"/>
    <rect class="packet-out packet-out-2" x="338" y="147" width="18" height="14" rx="4" fill="var(--teal)"/>
  </g>

  <!-- Bottom return verification track -->
  <path d="M330 202 H670" class="wire" stroke-dasharray="4 7"/>
  <path d="M339 197 L329 202 L339 207" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="226" text-anchor="middle" font-size="12.5" font-weight="600" class="muted">Lock state, launch &amp; JSON receipt</text>

  <g>
    <rect class="packet-ack" x="644" y="195" width="16" height="14" rx="7" fill="var(--green)"/>
  </g>

  <text x="500" y="274" text-anchor="middle" font-size="10.8" font-weight="600" class="muted">Tailscale · Headscale · ZeroTier · NetBird · WireGuard</text>

  <!-- Target iPhone illustration -->
  <rect x="786" y="72" width="86" height="154" rx="20" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.6"/>
  <rect x="812" y="81" width="34" height="7" rx="3.5" fill="var(--ink)"/>
  <circle class="pulse-ring" cx="829" cy="144" r="24" fill="none" stroke="var(--green)" stroke-width="2"/>
  <rect x="807" y="122" width="44" height="44" rx="12" fill="var(--ok-fill)" stroke="var(--green)" stroke-width="1.4"/>
  <path d="M818 144 L826 152 L841 136" fill="none" stroke="var(--green)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="829" y="190" text-anchor="middle" font-size="11.5" font-weight="600" class="muted">Launched</text>
  <path d="M816 215 H842" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" opacity="0.65"/>

  <text x="829" y="256" text-anchor="middle" font-size="20" font-weight="700">Your iPhone / iPad</text>
  <text x="829" y="280" text-anchor="middle" font-size="13.5" class="muted">Different Wi-Fi. Same paired device.</text>
  <rect x="765" y="294" width="128" height="24" rx="12" fill="var(--ok-fill)"/>
  <text x="829" y="310" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--green);">Unlocked &amp; Bridged</text>

  <!-- Footer summary -->
  <text x="500" y="374" text-anchor="middle" font-size="14" font-weight="500" class="muted">Pair once over USB on the Builder Mac. Then deploy over any Wi-Fi + private VPN.</text>
</svg>
