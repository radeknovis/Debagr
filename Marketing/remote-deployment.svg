<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">From your Xcode Mac to your remote iPhone</title>
  <desc id="desc">A paired Builder Mac at home builds and signs with Xcode. Debagr installs and launches on an iPhone on another Wi-Fi network through a private VPN. Pair once over USB before remote deployment.</desc>
  <style>
    :root { --ink:#172334; --muted:#596778; --panel:#f4f7fb; --line:#ced8e4; --blue:#246ae8; --green:#16805b; }
    @media (prefers-color-scheme:dark) { :root { --ink:#edf3ff; --muted:#a7b5c9; --panel:#141e2d; --line:#34445b; --blue:#70a8ff; --green:#61d6ad; } }
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .wire { fill:none; stroke:var(--line); stroke-width:2; }
    .packet { animation:send 5s linear infinite; }
    .packet2 { animation-delay:-2.5s; }
    @keyframes send { 0% { transform:translateX(0); opacity:0; } 8%,90% { opacity:1; } 100% { transform:translateX(340px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .packet { animation:none; } .packet2 { transform:translateX(340px); } }
  </style>
  <rect x="24" y="24" width="292" height="300" rx="24" fill="var(--panel)"/>
  <rect x="684" y="24" width="292" height="300" rx="24" fill="var(--panel)"/>
  <text x="170" y="60" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" class="muted">HOME / OFFICE WI-FI</text>
  <text x="830" y="60" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" class="muted">CAFE / AIRPORT WI-FI</text>
  <!-- Builder Mac -->
  <rect x="75" y="89" width="190" height="126" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M150 216v19h-30m70-19v19h30" class="wire"/>
  <rect x="90" y="104" width="160" height="94" rx="4" fill="var(--blue)" opacity=".09"/>
  <text x="170" y="143" text-anchor="middle" font-size="22" font-weight="650">Xcode</text>
  <text x="170" y="174" text-anchor="middle" font-size="15" fill="var(--blue)">+ Debagr</text>
  <text x="170" y="269" text-anchor="middle" font-size="21" font-weight="650">Builder Mac</text>
  <text x="170" y="295" text-anchor="middle" font-size="15" class="muted">Build &amp; sign</text>
  <!-- Private network: no cloud service or relay implied -->
  <path d="M282 165h436" class="wire" stroke-dasharray="5 7"/>
  <path d="m709 160 9 5-9 5" fill="none" stroke="var(--blue)" stroke-width="2"/>
  <text x="500" y="118" text-anchor="middle" font-size="19" font-weight="600">Private VPN</text>
  <text x="500" y="140" text-anchor="middle" font-size="13" class="muted">e.g. Tailscale</text>
  <g fill="var(--blue)">
    <rect class="packet" x="310" y="159" width="14" height="12" rx="3"/>
    <rect class="packet packet2" x="310" y="159" width="14" height="12" rx="3"/>
  </g>
  <text x="500" y="207" text-anchor="middle" font-size="15" class="muted">Install &amp; launch →</text>
  <!-- Remote iPhone -->
  <rect x="788" y="79" width="84" height="154" rx="19" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <rect x="814" y="87" width="32" height="7" rx="3.5" fill="var(--ink)"/>
  <rect x="810" y="127" width="40" height="40" rx="10" fill="var(--green)" opacity=".14"/>
  <path d="m820 147 7 7 14-16" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="830" y="193" text-anchor="middle" font-size="12" class="muted">Your app</text>
  <path d="M818 222h24" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  <text x="830" y="269" text-anchor="middle" font-size="21" font-weight="650">Your iPhone</text>
  <text x="830" y="295" text-anchor="middle" font-size="15" class="muted">Another network. Same device.</text>
  <text x="500" y="365" text-anchor="middle" font-size="15" class="muted">Pair once over USB. Then take your iPhone with you.</text>
</svg>
